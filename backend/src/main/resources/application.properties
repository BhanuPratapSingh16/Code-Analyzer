spring.application.name=codegraph-backend

server.port=8080

# PostgreSQL connection
spring.datasource.url=${PG_DB_URL:jdbc:postgresql://localhost:5432/codegraph}
spring.datasource.username=${PG_DB_USERNAME}
spring.datasource.password=${PG_DB_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# RAG Connection
rag.engine.url=${RAG_ENGINE_URL}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=9000000